<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
    <!-- Logo Memory Game : une carte de dos + une carte retournee avec une pierre -->
    <defs>
        <linearGradient id="dos" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#66bb6a"/>
            <stop offset="0.45" stop-color="#4CAF50"/>
            <stop offset="1" stop-color="#3d8b40"/>
        </linearGradient>
    </defs>

    <!-- carte cachee (dos vert), penchee a gauche -->
    <g transform="rotate(-12 16 24)">
        <rect x="5" y="9" width="22" height="29" rx="4" fill="#275f2a" transform="translate(0 3)"/>
        <rect x="5" y="9" width="22" height="29" rx="4" fill="url(#dos)" stroke="#fff" stroke-width="2"/>
        <rect x="8.5" y="12.5" width="15" height="22" rx="2.5" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>

    <!-- carte retournee (face blanche), penchee a droite -->
    <g transform="rotate(10 32 24)">
        <rect x="20" y="8" width="23" height="30" rx="4" fill="#275f2a" transform="translate(0 3)"/>
        <rect x="20" y="8" width="23" height="30" rx="4" fill="#fff" stroke="#275f2a" stroke-width="2"/>

        <!-- la pierre (meme forme que .gem) -->
        <polygon points="28.2,16.5 34.8,16.5 38,20.5 31.5,29.5 25,20.5" fill="#d81b45"/>
        <polygon points="28.2,16.5 31.5,16.5 29.5,20.5 25,20.5" fill="#fff" fill-opacity="0.55"/>
        <polygon points="34.8,16.5 38,20.5 31.5,29.5 33.5,20.5" fill="#000" fill-opacity="0.2"/>

        <!-- petit trait "nom de la pierre" sous l'image -->
        <rect x="26.5" y="32" width="10" height="2" rx="1" fill="#275f2a" fill-opacity="0.35"/>
    </g>
</svg>
